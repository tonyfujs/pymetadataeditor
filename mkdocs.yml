site_name: pyMetadataEditor
site_description: Python client library for the Metadata Editor API
repo_url: https://github.com/tonyfujs/pymetadataeditor
repo_name: tonyfujs/pymetadataeditor

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: light blue

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            unwrap_annotated: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - User Guide:
      - Browsing & Discovering Projects: user_guide/01_browsing_projects.md
      - Schemas & Templates: user_guide/02_schemas_and_templates.md
      - Creating New Metadata: user_guide/03_creating_metadata.md
      - Retrieving Existing Metadata: user_guide/04_retrieving_metadata.md
      - Updating Metadata: user_guide/05_updating_metadata.md
      - Working with Formats: user_guide/06_working_with_formats.md
      - AI-Powered Metadata Generation: user_guide/07_ai_powered_generation.md
      - Managing Collections: user_guide/08_managing_collections.md
      - Managing Resources: user_guide/09_managing_resources.md
      - Managing Admin Metadata: user_guide/12_managing_admin_metadata.md
      - Users & Collection Permissions: user_guide/13_users_and_permissions.md
      - Deleting Data: user_guide/10_deleting_data.md
